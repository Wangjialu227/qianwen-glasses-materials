<script>
/* ===== IndexedDB ===== */
const DB_NAME = 'QianwenImages';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('images')) {
        d.createObjectStore('images', { keyPath: 'id' });
      }
    };
  });
}

function saveImage(id, base64) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('images', 'readwrite');
    const store = tx.objectStore('images');
    store.put({ id, data: base64 });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function deleteImage(id) {
  return new Promise((resolve) => {
    if (!db) return resolve();
    const tx = db.transaction('images', 'readwrite');
    const store = tx.objectStore('images');
    store.delete(id);
    tx.oncomplete = resolve;
  });
}

function getImage(id) {
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    const tx = db.transaction('images', 'readonly');
    const store = tx.objectStore('images');
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result ? req.result.data : null);
    req.onerror = () => resolve(null);
  });
}

/* ===== State ===== */
let localData = [];
let editCount = 0;
let pendingImage = { id: '', data: '' };

const DIRECTION_TO_VSLABEL = {
  'S1考研场景': 'S1考研场景',
  'G1生活场景': 'G1生活场景',
  'S1纵测': 'S1纵测'
};

/* ===== Init ===== */
const IMAGE_STORE_KEY = 'qianwen_glasses_images';  // { "nickname|pubTime": { imageId, imageData } }

async function init() {
  await openDB();
  try {
    const resp = await fetch('data.json');
    if (resp.ok) localData = await resp.json();
  } catch(e) {
    localData = [];
  }
  // Merge saved images from localStorage
  loadImagesFromStorage();
  // Reload images from IndexedDB if available
  await loadImagesFromIDB();
  render();
}

function saveToStorage() {
  // Save all images to localStorage (keyed by nickname|pubTime)
  const store = {};
  localData.forEach(d => {
    if (d.imageId && d.imageData) {
      const key = (d.nickname || '').trim() + '|' + (d.pubTime || '').trim();
      store[key] = { imageId: d.imageId, imageData: d.imageData };
    }
  });
  localStorage.setItem(IMAGE_STORE_KEY, JSON.stringify(store));
}

function loadImagesFromStorage() {
  try {
    const raw = localStorage.getItem(IMAGE_STORE_KEY);
    if (!raw) return;
    const store = JSON.parse(raw);
    localData.forEach(d => {
      const key = (d.nickname || '').trim() + '|' + (d.pubTime || '').trim();
      if (store[key] && !d.imageData) {
        d.imageId = store[key].imageId;
        d.imageData = store[key].imageData;
      }
    });
  } catch(e) { /* ignore */ }
}

/* ===== Image Upload ===== */
function handleImageUpload(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const base64 = ev.target.result;
    const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    pendingImage = { id, data: base64 };
    document.getElementById('fImageId').value = id;
    document.getElementById('fImageData').value = base64;
    document.getElementById('uploadPreview').src = base64;
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('uploadText').style.display = 'none';
    document.getElementById('imgUploadArea').classList.add('has-image');
  };
  reader.readAsDataURL(file);
}

function resetImageUpload() {
  pendingImage = { id: '', data: '' };
  document.getElementById('imgFile').value = '';
  document.getElementById('fImageId').value = '';
  document.getElementById('fImageData').value = '';
  document.getElementById('uploadPreview').style.display = 'none';
  document.getElementById('uploadText').style.display = 'block';
  document.getElementById('imgUploadArea').classList.remove('has-image');
}

/* ===== Inline Upload (click "无图" cell) ===== */
let pendingInlineIndex = -1;

function triggerInlineUpload(index) {
  pendingInlineIndex = index;
  document.getElementById('inlineImgInput').click();
}

function handleInlineImageUpload(e) {
  const file = e.target.files[0];
  if (!file || pendingInlineIndex < 0) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    const base64 = ev.target.result;
    const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
    localData[pendingInlineIndex].imageId = id;
    localData[pendingInlineIndex].imageData = base64;
    localData[pendingInlineIndex]._dirty = true;
    editCount++;
    saveToStorage();
    render();
    toast(`📷 「${localData[pendingInlineIndex].nickname}」封面上传成功`);
    pendingInlineIndex = -1;
    e.target.value = '';
  };
  reader.readAsDataURL(file);
}

/* ===== Batch Image Upload ===== */
async function handleBatchImageUpload(e) {
  const files = e.target.files;
  if (!files || files.length === 0) return;

  // Build nickname index
  const nameMap = {};
  localData.forEach((d, i) => {
    const name = (d.nickname || '').trim();
    if (name) nameMap[name] = i;
  });

  let matched = 0, unmatched = 0;
  const readers = [];

  for (const file of files) {
    readers.push(new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const base64 = ev.target.result;
        const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        const fname = file.name.replace(/\.[^.]+$/, ''); // remove extension

        // Try to match filename to nickname
        let bestMatch = -1;
        let bestScore = 0;
        for (const [name, idx] of Object.entries(nameMap)) {
          // Check if filename contains nickname or nickname contains filename
          if (fname.includes(name) || name.includes(fname)) {
            const score = Math.min(fname.length, name.length);
            if (score > bestScore) { bestScore = score; bestMatch = idx; }
          }
        }

        if (bestMatch >= 0) {
          localData[bestMatch].imageId = id;
          localData[bestMatch].imageData = base64;
          localData[bestMatch]._dirty = true;
          matched++;
        } else {
          unmatched++;
        }
        resolve({ file: file.name, matched: bestMatch >= 0, nickname: bestMatch >= 0 ? localData[bestMatch].nickname : '' });
      };
      reader.readAsDataURL(file);
    }));
  }

  await Promise.all(readers);
  editCount += matched;
  saveToStorage();
  render();

  const resultDiv = document.getElementById('batchResult');
  resultDiv.innerHTML = `✅ 匹配成功 ${matched} 张，未匹配 ${unmatched} 张` +
    (unmatched > 0 ? `<br><span style="color:#e65100;">提示：未匹配的图片文件名不含任何已知昵称</span>` : '');
  e.target.value = '';
}

/* ===== Remove All Images ===== */
function removeAllImages() {
  if (!confirm('确定要清空全部笔记的封面图片吗？此操作不可撤销。')) return;
  localData.forEach(d => { delete d.imageId; delete d.imageData; d._dirty = true; });
  editCount++;
  saveToStorage();
  render();
  toast('已清空全部图片');
}

/* ===== Dedup Logic ===== */
function isDuplicate(newEntry, existingList) {
  // 同一达人 + 同一发布日期 = 重复
  const key = (newEntry.nickname || '').trim() + '|' + (newEntry.pubTime || '').trim();
  return existingList.some(d =>
    (d.nickname || '').trim() === (newEntry.nickname || '').trim() &&
    (d.pubTime || '').trim() === (newEntry.pubTime || '').trim()
  );
}

function findDuplicateIndex(newEntry) {
  return localData.findIndex(d =>
    (d.nickname || '').trim() === (newEntry.nickname || '').trim() &&
    (d.pubTime || '').trim() === (newEntry.pubTime || '').trim()
  );
}

/* ===== VS Classification ===== */
function classifyVsModels(text) {
  if (!text) return '';
  if (text.includes('不同预算') || text.includes('显示款vs无屏款')) return '特殊';
  const parts = text.split(/vs|VS/);
  if (parts.length < 2) return '';
  const after = parts[1].trim();
  if (!after) return '1v1';
  const brandMap = {'乐奇':1,'华为':1,'小米':1,'雷鸟':1,'Meta':1,'科大讯飞':1,'理想':1,'小度':1};
  let brands = new Set();
  after.split(/\s+/).forEach(b => {
    for (let key of Object.keys(brandMap)) if (b.includes(key)) brands.add(key);
  });
  if (brands.size <= 1) return '1v1';
  if (brands.size === 2) return '1v2';
  return '1v多';
}

/* ===== Render ===== */
function render() {
  document.getElementById('statsBar').textContent = `共 ${localData.length} 条记录${editCount > 0 ? ' (有 ' + editCount + ' 处未保存修改)' : ''}`;
  document.getElementById('editCount').textContent = editCount > 0 ? `⚠ ${editCount} 处修改未导出` : '';

  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = localData.map((d, i) => `
    <tr>
      <td>${i+1}</td>
      <td class="thumb-cell" onclick="triggerInlineUpload(${i})" title="点击上传封面图" style="cursor:pointer;">
        ${d.imageId ? `<img src="${d.imageData || ''}" alt="" style="width:48px;height:48px;object-fit:cover;border-radius:4px;">` : '<div class="no-img">+ 上传</div>'}
      </td>
      <td><strong>${d.nickname}</strong></td>
      <td><span style="font-size:10px;padding:2px 6px;border-radius:4px;background:#e0e7ff;color:#4338ca;">${d.direction||'-'}</span></td>
      <td style="max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${d.vsModels||''}">${d.vsModels||'-'}</td>
      <td>${d.vsClass||d.vsLabel||'-'}</td>
      <td>${d.status||'-'}</td>
      <td>${d.pubTime||'-'}</td>
      <td>${formatNum(d.reads)}</td>
      <td>${formatNum(d.interactions)}</td>
      <td>
        ${d.pubLink?`<a href="${d.pubLink}" target="_blank">笔记</a>`:''}
        ${d.homepage?`<a href="${d.homepage}" target="_blank">主页</a>`:''}
      </td>
      <td>
        <button class="edit-btn" onclick="openEditModal(${i})">编辑</button>
        <button class="delete-btn" onclick="deleteEntry(${i})">删除</button>
      </td>
    </tr>
  `).join('');
}

/* ===== Modal ===== */
function openAddModal() {
  document.getElementById('modalTitle').textContent = '新增笔记';
  document.getElementById('editIndex').value = '-1';
  document.getElementById('editForm').reset();
  resetImageUpload();
  document.getElementById('fStatus').value = '已发布';
  document.getElementById('editModal').classList.add('show');
}

async function openEditModal(index) {
  const d = localData[index];
  document.getElementById('modalTitle').textContent = `编辑 - ${d.nickname}`;
  document.getElementById('editIndex').value = index;

  document.getElementById('fNickname').value = d.nickname || '';
  document.getElementById('fPubTime').value = d.pubTime || '';
  document.getElementById('fDirection').value = d.direction || '';
  document.getElementById('fVsClass').value = (['1v1','1v2','1v多','特殊'].includes(d.vsClass) ? d.vsClass : '');
  document.getElementById('fVsModels').value = d.vsModels || '';
  document.getElementById('fStatus').value = d.status || '已发布';
  document.getElementById('fPubLink').value = d.pubLink || '';
  document.getElementById('fHomepage').value = d.homepage || '';
  document.getElementById('fNoteId').value = d.noteId || '';
  document.getElementById('fReads').value = d.reads || 0;
  document.getElementById('fInteractions').value = d.interactions || 0;
  document.getElementById('fLikes').value = d.likes || 0;
  document.getElementById('fCollects').value = d.collects || 0;
  document.getElementById('fComments').value = d.comments || 0;
  document.getElementById('fShares').value = d.shares || 0;
  document.getElementById('fCopyText').value = d.copyText || '';

  // Image
  if (d.imageId && d.imageData) {
    document.getElementById('fImageId').value = d.imageId;
    document.getElementById('fImageData').value = d.imageData;
    document.getElementById('uploadPreview').src = d.imageData;
    document.getElementById('uploadPreview').style.display = 'block';
    document.getElementById('uploadText').style.display = 'none';
    document.getElementById('imgUploadArea').classList.add('has-image');
    pendingImage = { id: d.imageId, data: d.imageData };
  } else {
    resetImageUpload();
  }

  document.getElementById('editModal').classList.add('show');
}

function closeModal() {
  document.getElementById('editModal').classList.remove('show');
}

async function saveEntry(event) {
  event.preventDefault();
  const index = parseInt(document.getElementById('editIndex').value);

  const nickname = document.getElementById('fNickname').value.trim();
  const pubTime = document.getElementById('fPubTime').value.trim();

  if (!nickname || !pubTime) {
    toast('昵称和发布日期为必填项');
    return;
  }

  const vsModels = document.getElementById('fVsModels').value.trim();
  let vsClass = document.getElementById('fVsClass').value;
  if (!vsClass && vsModels) {
    vsClass = classifyVsModels(vsModels);
  }
  if (!vsClass) {
    const dir = document.getElementById('fDirection').value;
    vsClass = DIRECTION_TO_VSLABEL[dir] || '';
  }

  const entry = {
    nickname: nickname,
    homepage: document.getElementById('fHomepage').value.trim(),
    direction: document.getElementById('fDirection').value,
    vsModels: vsModels,
    vsClass: vsClass,
    vsLabel: vsClass,
    status: document.getElementById('fStatus').value,
    pubLink: document.getElementById('fPubLink').value.trim(),
    noteId: document.getElementById('fNoteId').value.trim(),
    pubTime: pubTime,
    reads: parseInt(document.getElementById('fReads').value) || 0,
    interactions: parseInt(document.getElementById('fInteractions').value) || 0,
    likes: parseInt(document.getElementById('fLikes').value) || 0,
    collects: parseInt(document.getElementById('fCollects').value) || 0,
    comments: parseInt(document.getElementById('fComments').value) || 0,
    shares: parseInt(document.getElementById('fShares').value) || 0,
    copyText: document.getElementById('fCopyText').value.trim(),
    imageId: pendingImage.id || document.getElementById('fImageId').value || '',
    imageData: pendingImage.data || document.getElementById('fImageData').value || ''
  };

  // Check duplicate for new entries
  if (index === -1) {
    if (isDuplicate(entry, localData)) {
      if (!confirm(`达人 "${nickname}" 在 "${pubTime}" 已有记录，确认添加重复条目？`)) return;
    }
    localData.push(entry);
    toast('已添加: ' + entry.nickname);
  } else {
    // For edit, if nickname/pubTime changed, check dup
    const old = localData[index];
    if ((old.nickname !== entry.nickname || old.pubTime !== entry.pubTime) && isDuplicate(entry, localData.filter((_, i) => i !== index))) {
      if (!confirm(`修改后将与现有记录重复（同一达人+同一日期），确认？`)) return;
    }
    localData[index] = entry;
    toast('已更新: ' + entry.nickname);
  }

  // Save image to IndexedDB
  if (pendingImage.id && pendingImage.data) {
    await saveImage(pendingImage.id, pendingImage.data);
  }

  editCount++;
  closeModal();
  render();
}

function deleteEntry(index) {
  if (!confirm(`确认删除 "${localData[index].nickname}" 吗？`)) return;
  const imgId = localData[index].imageId;
  if (imgId) deleteImage(imgId);
  localData.splice(index, 1);
  editCount++;
  render();
  toast('已删除');
}

/* ===== Export ===== */
function exportData() {
  // Clean export: include imageData in JSON for portability
  const exportList = localData.map(d => {
    const { _dirty, ...clean } = d;
    return clean;
  });
  const json = JSON.stringify(exportList, null, 2);
  downloadFile('data.json', json);
  editCount = 0;
  render();
  toast('data.json 已导出');
}

/* ===== Import ===== */
function importData() {
  const text = document.getElementById('importArea').value.trim();
  if (!text) return toast('请粘贴 JSON 数据');
  try {
    const arr = JSON.parse(text);
    if (!Array.isArray(arr)) throw new Error('Not array');
    if (!confirm(`将用 ${arr.length} 条数据覆盖当前 ${localData.length} 条，确认？`)) return;
    localData = arr;
    editCount = 0;
    render();
    toast(`已覆盖导入 ${arr.length} 条`);
  } catch(e) {
    toast('JSON 格式错误: ' + e.message);
  }
}

function mergeData() {
  const text = document.getElementById('importArea').value.trim();
  if (!text) return toast('请粘贴 JSON 数据');
  try {
    const arr = JSON.parse(text);
    if (!Array.isArray(arr)) throw new Error('Not array');
    let added = 0, dup = 0;
    arr.forEach(item => {
      if (isDuplicate(item, localData)) {
        dup++;
      } else {
        localData.push(item);
        added++;
      }
    });
    editCount += added;
    render();
    toast(`合并完成：新增 ${added} 条，去重跳过 ${dup} 条`);
  } catch(e) {
    toast('JSON 格式错误: ' + e.message);
  }
}

/* ===== Utils ===== */
function downloadFile(filename, content) {
  const blob = new Blob([content], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function formatNum(n) {
  if (!n || n === 0) return '0';
  if (n >= 10000) return (n/10000).toFixed(1) + 'w';
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(n);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('editModal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

init();
</script>
