<script>
/* ===== IndexedDB for Images ===== */
const DB_NAME = 'QianwenImages';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('images')) {
        d.createObjectStore('images', { keyPath: 'id' });
      }
    };
  });
}

function saveImage(id, base64) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('images', 'readwrite');
    const store = tx.objectStore('images');
    store.put({ id, data: base64 });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function getImage(id) {
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    const tx = db.transaction('images', 'readonly');
    const store = tx.objectStore('images');
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result ? req.result.data : null);
    req.onerror = () => resolve(null);
  });
}

/* ===== Data State ===== */
let allData = [];
let activeFilter = '全部';
let imageCache = {};

/* ===== Init ===== */
const IMAGE_STORE_KEY = 'qianwen_glasses_images';

async function init() {
  await openDB();
  try {
    // no-cache:每次走条件请求——数据没变(GitHub返回304)用浏览器缓存,秒开;变了再拉新数据
    const resp = await fetch('data.json?v=3', { cache: 'no-cache' });
    if (resp.ok) allData = await resp.json();
    else allData = [];
  } catch(e) {
    // 网络失败时用 localStorage 兜底(上次成功的数据),避免白屏
    try {
      const raw = localStorage.getItem('qianwen_data_fallback');
      if (raw) allData = JSON.parse(raw);
    } catch(e2) {}
    if (!allData.length) allData = [];
  }
  // 缓存本次成功数据到 localStorage,供下次离线兜底
  try { localStorage.setItem('qianwen_data_fallback', JSON.stringify(allData)); } catch(e) {}
  // Merge saved images from localStorage (admin.html shares this)
  loadImagesFromStorage();
  // Preload images
  const ids = allData.filter(d => d.imageId).map(d => d.imageId);
  await Promise.all(ids.map(async id => {
    const data = await getImage(id);
    if (data) imageCache[id] = data;
  }));
  render();
}

function loadImagesFromStorage() {
  try {
    const raw = localStorage.getItem(IMAGE_STORE_KEY);
    if (!raw) return;
    const store = JSON.parse(raw);
    allData.forEach(d => {
      const key = (d.nickname || '').trim() + '|' + (d.pubTime || '').trim();
      if (store[key]) {
        d.imageId = d.imageId || store[key].imageId;
        d.imageData = d.imageData || store[key].imageData;
      }
    });
  } catch(e) { /* ignore */ }
}

/* ===== Statistics ===== */
function calcStats() {
  const total = allData.length;
  const c1v1 = allData.filter(d => d.vsClass === '1v1').length;
  const c1v2 = allData.filter(d => d.vsClass === '1v2').length;
  const c1vD = allData.filter(d => d.vsClass === '1v多').length;
  const scene = allData.filter(d => ['S1考研场景','G1生活场景'].includes(d.vsClass)).length;
  const zongce = allData.filter(d => d.vsClass === 'S1纵测').length;
  return { total, c1v1, c1v2, c1vD, scene, zongce };
}

function renderStats() {
  const s = calcStats();
  document.getElementById('statsBar').innerHTML = `
    <span class="stat-chip"><span class="icon">📊</span>素材总数 <span class="num">${s.total}</span></span>
    <span class="stat-chip"><span class="icon">📄</span>1v1 <span class="num">${s.c1v1}</span></span>
    <span class="stat-chip"><span class="icon">📄</span>1v2 <span class="num">${s.c1v2}</span></span>
    <span class="stat-chip"><span class="icon">📄</span>1v多 <span class="num">${s.c1vD}</span></span>
    <span class="stat-chip"><span class="icon">🎯</span>生活场景 <span class="num">${s.scene}</span></span>
    <span class="stat-chip"><span class="icon">🔬</span>综合纵测 <span class="num">${s.zongce}</span></span>
  `;
}

/* ===== Filters ===== */
const FILTER_DEFS = [
  { key: '全部', label: '全部' },
  { key: '1v1', label: '1v1' },
  { key: '1v2', label: '1v2' },
  { key: '1v多', label: '1v多' },
  { key: '场景', label: '生活场景' },
  { key: '纵测', label: '综合纵测' },
];

function renderFilters() {
  const s = calcStats();
  const counts = {
    '全部': s.total,
    '1v1': s.c1v1,
    '1v2': s.c1v2,
    '1v多': s.c1vD,
    '场景': s.scene,
    '纵测': s.zongce,
  };
  document.getElementById('filterWrap').innerHTML = FILTER_DEFS.map(f => {
    const active = f.key === activeFilter ? 'active' : '';
    return `<span class="filter-tag ${active}" onclick="setFilter('${f.key}')">${f.label}<span class="count">${counts[f.key]||0}</span></span>`;
  }).join('');
}

function setFilter(key) {
  activeFilter = key;
  renderFilters();
  render();
}

/* ===== Render ===== */
function render() {
  renderStats();
  renderFilters();

  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  let filtered = allData.filter(d => {
    if (activeFilter === '全部') return true;
    if (activeFilter === '1v1') return d.vsClass === '1v1';
    if (activeFilter === '1v2') return d.vsClass === '1v2';
    if (activeFilter === '1v多') return d.vsClass === '1v多';
    if (activeFilter === '场景') return ['S1考研场景','G1生活场景'].includes(d.vsClass);
    if (activeFilter === '纵测') return d.vsClass === 'S1纵测';
    return true;
  });

  if (search) {
    filtered = filtered.filter(d =>
      d.nickname.toLowerCase().includes(search) ||
      (d.vsModels||'').toLowerCase().includes(search) ||
      (d.direction||'').toLowerCase().includes(search)
    );
  }

  // Results header
  const vsLabel = activeFilter === '1v1' ? '千问 vs 1个竞品' :
                  activeFilter === '1v2' ? '千问 vs 2个竞品' :
                  activeFilter === '1v多' ? '千问 vs 多个竞品' :
                  activeFilter === '场景' ? '场景化内容' :
                  activeFilter === '纵测' ? '纵向评测' : '全部素材';
  const grid = document.getElementById('cardGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有匹配的素材</p></div>';
    return;
  }

  // 保存当前过滤结果，供 lightbox 图片切换导航
  window.__currentFiltered = filtered;

  // ===== 按达人昵称分组 =====
  const gmap = new Map();
  filtered.forEach(d => {
    const nick = d.nickname || '未知';
    if (!gmap.has(nick)) gmap.set(nick, []);
    gmap.get(nick).push(d);
  });
  const groups = [];
  gmap.forEach((notes, nick) => {
    // 收集该达人全部图片(按笔记顺序,第一张即封面;同路径自动去重)
    // src 存原图路径用于预览, thumb 存缩略图路径用于网格
    const images = [];
    const seenImg = new Set();
    notes.forEach(n => {
      const list = (n.imageList && n.imageList.length > 0) ? n.imageList : (n.imageData ? [n.imageData] : []);
      list.forEach(src => {
        if (!seenImg.has(src)) { seenImg.add(src); images.push({ src, thumb: src.replace(/^images\//, 'thumbs/'), note: n }); }
      });
    });
    groups.push({ nick, notes, images });
  });
  window.__groups = groups;

  // Results header
  document.getElementById('resultsHeader').innerHTML = `
    <span class="count">共 ${groups.length} 个达人 · ${filtered.length} 条素材</span>
    <span class="tag">${vsLabel}</span>
  `;

  // 有图的达人优先展示
  groups.sort((a, b) => b.images.length - a.images.length);

  grid.innerHTML = groups.map((g, gIdx) => {
    const firstChar = g.nick.charAt(0);
    // 合并产品标签与竞品标签
    const productSet = new Set();
    const comps = [];
    g.notes.forEach(n => {
      productSet.add(n.direction && n.direction.includes('S1') ? '千问AI眼镜S1' :
                     n.direction && n.direction.includes('G1') ? '千问AI眼镜G1' : '千问AI眼镜');
      extractCompetitors(n.vsModels).forEach(c => { if (!comps.includes(c)) comps.push(c); });
    });
    const tagHtml = [...productSet].map(p => `<span class="p-tag primary">${p}</span>`).join('') +
                    comps.slice(0, 3).map(c => `<span class="p-tag">${c}</span>`).join('');

    // 图片横排区：网格显示缩略图，点击预览才加载原图
    const thumbOf = (src) => src.replace(/^images\//, 'thumbs/');
    const imgHtml = g.images.length > 0
      ? `<div class="gc-images">${g.images.map((img, i) => `
          <div class="gc-img${i === 0 ? ' cover' : ''}" onclick="openGroupLightbox(${gIdx}, ${i})" title="${img.note.pubTime || ''}">
            <img src="${thumbOf(img.src)}" loading="lazy" decoding="async" alt="${g.nick} 第${i + 1}张">
            ${i === 0 ? '<span class="gc-cover-badge">封面</span>' : ''}
            ${g.images.length > 1 ? `<span class="gc-img-index">${i + 1}</span>` : ''}
          </div>`).join('')}</div>`
      : `<div class="gc-images"><div class="gc-img empty">暂无图片</div></div>`;

    // 组卡底部:每篇笔记一行
    const noteRows = g.notes.map(n => {
      const vsText = n.vsModels ? `${n.vsModels} · 共${extractCompetitors(n.vsModels).length}个竞品` : (n.direction || '');
      const hasCopy = n.copyText && n.copyText.trim().length > 0;
      const copyText = hasCopy ? n.copyText : '';
      // 无真实文案的笔记:按钮禁用并明确提示"暂无文案"
      const copyBtn = hasCopy
        ? `<button class="btn-copy" onclick="copyText(this, '${escapeJS(copyText)}')">📋 复制文案</button>`
        : `<button class="btn-copy" disabled title="该笔记未发布或无正文，暂无文案可复制" style="background:#e5e7eb;color:#9ca3af;cursor:not-allowed">📋 暂无文案</button>`;
      return `
      <div class="gc-note-row">
        <span class="gc-vs-text">${vsText}${n.status ? `<span class="gc-status">${n.status}</span>` : ''}</span>
        <div class="gc-actions">
          ${copyBtn}
          ${n.pubLink ? `<a class="btn-link" href="${n.pubLink}" target="_blank">🔗 原文</a>` : '<button class="btn-link" disabled>无链接</button>'}
        </div>
      </div>`;
    }).join('');

    return `
    <div class="group-card">
      <div class="gc-header">
        <div class="card-avatar">${firstChar}</div>
        <div class="card-name-wrap">
          <div class="card-name">${g.nick}</div>
          <div class="card-meta">${g.notes.length} 篇笔记 · ${g.images.length} 张图${g.images.length ? ' · 点击图片预览全部' : ''}</div>
        </div>
        <span class="gc-img-num">${g.images.length ? g.images.length + '图' : ''}</span>
        <div class="gc-tags">${tagHtml}</div>
      </div>
      ${imgHtml}
      <div class="gc-note-rows">${noteRows}</div>
    </div>`;
  }).join('');
}

/* ===== Helpers ===== */
function extractCompetitors(vsModels) {
  if (!vsModels) return [];
  const text = vsModels.replace(/^S1|G1/g, '').replace(/vs|VS/g, ' ');
  const brandMap = {'乐奇':1,'华为':1,'小米':1,'雷鸟':1,'Meta':1,'科大讯飞':1,'理想':1,'小度':1};
  const found = [];
  for (let b of Object.keys(brandMap)) {
    if (text.includes(b)) found.push(b);
  }
  return found;
}

function formatNum(n) {
  if (!n || n === 0) return '0';
  if (n >= 10000) return (n/10000).toFixed(1) + 'w';
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(n);
}

function escapeJS(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
}

async function copyText(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
    const original = btn.innerHTML;
    btn.innerHTML = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove('copied');
    }, 1500);
  } catch(e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制到剪贴板');
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===== Lightbox Controls ===== */
let lbImages = [];   // 当前预览的图片列表(原图)
let lbThumbs = [];   // 对应缩略图列表(秒显占位)
let lbMeta = {};     // 当前预览的卡片元信息
let lbIndex = 0;

function thumbOf(src) { return src.replace(/^images\//, 'thumbs/'); }

/* 组模式:点击某达人任意一张图,预览该达人全部图片 */
function openGroupLightbox(gIdx, imgIdx) {
  const groups = window.__groups || [];
  const g = groups[gIdx];
  if (!g || !g.images || g.images.length === 0) return;
  lbImages = g.images.map(x => x.src);  // 预览用原图
  lbThumbs = g.images.map(x => x.thumb || thumbOf(x.src));
  lbMeta = { nickname: g.nick, sub: `${g.nick} · ${g.notes.length} 篇笔记 · ${g.images.length} 张图` };
  lbIndex = imgIdx || 0;
  showLightboxItem();
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function openLightbox(idx) {
  const list = window.__currentFiltered || [];
  const item = list[idx];
  if (!item) return;
  // 该笔记自己的全部图片（有 imageList 用 imageList，否则用封面）
  lbImages = (item.imageList && item.imageList.length > 0) ? item.imageList : (item.imageData ? [item.imageData] : []);
  if (lbImages.length === 0) return;
  lbThumbs = lbImages.map(thumbOf);
  lbMeta = item;
  lbIndex = 0;
  showLightboxItem();
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function showLightboxItem() {
  const img = document.getElementById('lightboxImg');
  const fullSrc = lbImages[lbIndex];
  const thumbSrc = lbThumbs[lbIndex] || thumbOf(fullSrc);
  // 先显示缩略图(秒出),再后台加载原图,加载成功才替换为高清
  if (img.getAttribute('data-loading') === fullSrc) return;  // 同图加载中
  img.setAttribute('data-loading', fullSrc);
  const pre = new Image();
  pre.onload = () => {
    if (lbImages[lbIndex] === fullSrc) { img.src = fullSrc; img.removeAttribute('data-loading'); }
  };
  pre.onerror = () => img.removeAttribute('data-loading');
  pre.src = fullSrc;
  img.src = thumbSrc;
  const nameEl = document.getElementById('lbName');
  nameEl.textContent = lbMeta.nickname || '';
  const subEl = document.getElementById('lbSub');
  if (lbMeta.sub) {
    // 组模式:直接显示已拼好的副标题
    subEl.textContent = lbMeta.sub;
  } else {
    const product = lbMeta.direction && lbMeta.direction.includes('S1') ? '千问AI眼镜S1' :
                    lbMeta.direction && lbMeta.direction.includes('G1') ? '千问AI眼镜G1' : '';
    const vs = lbMeta.vsModels || lbMeta.direction || '';
    subEl.textContent = [product, vs, lbMeta.pubTime ? lbMeta.pubTime : ''].filter(Boolean).join(' · ');
  }
  const counter = document.getElementById('lbCounter');
  counter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
  // 更新 nav 可用状态
  document.querySelector('.lightbox-prev').style.opacity = lbImages.length > 1 ? 1 : 0.3;
  document.querySelector('.lightbox-next').style.opacity = lbImages.length > 1 ? 1 : 0.3;
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  if (lbImages.length <= 1) return;
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  showLightboxItem();
}

// 点击遮罩关闭
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'lightbox') closeLightbox();
});

// Esc 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

init();
</script>
