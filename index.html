<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;

/* ===== Header ===== */
.header {
  background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);

}

.stats-bar {

}
.stat-chip {

  border-radius: 16px;
  font-size: 12px;
  color: #fff;
  backdrop-filter: blur(4px);
}
.stat-chip .num { font-weight: 700; }
.stat-chip .icon { font-size: 11px; }

.mode-tag {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 8px;
  background: rgba(255,255,255,0.1);

  font-size: 11px;

/* ===== Search ===== */
.search-wrap {

  background: #fff;

.search-box {

  align-items: center;

.search-box .search-icon {

}

  background: transparent;

}

/* ===== Filter Tags ===== */
.filter-wrap {
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #eee;
  display: flex;
  flex-wrap: wrap;

}
.filter-tag {

  align-items: center;
  gap: 6px;

  background: #f5f6f8;
  border-radius: 8px;
  font-size: 13px;
  color: #666;

  border: 1px solid transparent;

}

.filter-tag.active {
  background: #4f46e5;

.card {

  transition: box-shadow 0.2s;
}

.card-top {

}

}
.card-avatar {

  align-items: center;

  font-size: 12px;

.card-image-area img {

}
.card-image-area:hover .card-image-hint {

.card-image-hint {

  padding: 3px 8px;
  border-radius: 12px;

}
.card-image-placeholder {
  text-align: center;

}
.card-image-placeholder .img-icon {

}
.card-image-placeholder .img-text {

}
.card-image-placeholder .img-sub {

}
.card-model-badge {

  font-weight: 600;

/* ===== Card Bottom ===== */
.card-bottom {

}

.card-actions {
  display: flex;

}

  flex: 1;
  text-align: center;
  padding: 8px 0;

.toast {

.lightbox {

<script>
/* ===== IndexedDB for Images ===== */
const DB_NAME = 'QianwenImages';
const DB_VERSION = 1;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onerror = () => reject(req.error);
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('images')) {
        d.createObjectStore('images', { keyPath: 'id' });
      }
    };
  });
}

function saveImage(id, base64) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('images', 'readwrite');
    const store = tx.objectStore('images');
    store.put({ id, data: base64 });
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

function getImage(id) {
  return new Promise((resolve) => {
    if (!db) return resolve(null);
    const tx = db.transaction('images', 'readonly');
    const store = tx.objectStore('images');
    const req = store.get(id);
    req.onsuccess = () => resolve(req.result ? req.result.data : null);
    req.onerror = () => resolve(null);
  });
}

/* ===== Data State ===== */
let allData = [];
let activeFilter = '全部';
let imageCache = {};

/* ===== Init ===== */
const IMAGE_STORE_KEY = 'qianwen_glasses_images';

async function init() {
  await openDB();
  try {
    // 加时间戳绕过浏览器缓存，确保每次拿到最新数据
    const resp = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
    allData = await resp.json();
  } catch(e) {
    allData = [];
  }
  // Merge saved images from localStorage (admin.html shares this)
  loadImagesFromStorage();
  // Preload images
  const ids = allData.filter(d => d.imageId).map(d => d.imageId);
  await Promise.all(ids.map(async id => {
    const data = await getImage(id);
    if (data) imageCache[id] = data;
  }));
  render();
}

function loadImagesFromStorage() {
  try {
    const raw = localStorage.getItem(IMAGE_STORE_KEY);
    if (!raw) return;
    const store = JSON.parse(raw);
    allData.forEach(d => {
      const key = (d.nickname || '').trim() + '|' + (d.pubTime || '').trim();
      if (store[key]) {
        d.imageId = d.imageId || store[key].imageId;
        d.imageData = d.imageData || store[key].imageData;
      }
    });
  } catch(e) { /* ignore */ }
}

/* ===== Statistics ===== */
function calcStats() {
  const total = allData.length;
  const c1v1 = allData.filter(d => d.vsClass === '1v1').length;
  const c1v2 = allData.filter(d => d.vsClass === '1v2').length;
  const c1vD = allData.filter(d => d.vsClass === '1v多').length;
  const scene = allData.filter(d => ['S1考研场景','G1生活场景'].includes(d.vsClass)).length;
  const zongce = allData.filter(d => d.vsClass === 'S1纵测').length;
  return { total, c1v1, c1v2, c1vD, scene, zongce };
}

function renderStats() {
  const s = calcStats();
  document.getElementById('statsBar').innerHTML = `
    <span class="stat-chip"><span class="icon">📊</span>素材总数 <span class="num">${s.total}</span></span>
    <span class="stat-chip"><span class="icon">📄</span>1v1 <span class="num">${s.c1v1}</span></span>
    <span class="stat-chip"><span class="icon">📄</span>1v2 <span class="num">${s.c1v2}</span></span>
    <span class="stat-chip"><span class="icon">📄</span>1v多 <span class="num">${s.c1vD}</span></span>
    <span class="stat-chip"><span class="icon">🎯</span>生活场景 <span class="num">${s.scene}</span></span>
    <span class="stat-chip"><span class="icon">🔬</span>综合纵测 <span class="num">${s.zongce}</span></span>
  `;
}

/* ===== Filters ===== */
const FILTER_DEFS = [
  { key: '全部', label: '全部' },
  { key: '1v1', label: '1v1' },
  { key: '1v2', label: '1v2' },
  { key: '1v多', label: '1v多' },
  { key: '场景', label: '生活场景' },
  { key: '纵测', label: '综合纵测' },
];

function renderFilters() {
  const s = calcStats();
  const counts = {
    '全部': s.total,
    '1v1': s.c1v1,
    '1v2': s.c1v2,
    '1v多': s.c1vD,
    '场景': s.scene,
    '纵测': s.zongce,
  };
  document.getElementById('filterWrap').innerHTML = FILTER_DEFS.map(f => {
    const active = f.key === activeFilter ? 'active' : '';
    return `<span class="filter-tag ${active}" onclick="setFilter('${f.key}')">${f.label}<span class="count">${counts[f.key]||0}</span></span>`;
  }).join('');
}

function setFilter(key) {
  activeFilter = key;
  renderFilters();
  render();
}

/* ===== Render ===== */
function render() {
  renderStats();
  renderFilters();

  const search = document.getElementById('searchInput').value.toLowerCase().trim();

  let filtered = allData.filter(d => {
    if (activeFilter === '全部') return true;
    if (activeFilter === '1v1') return d.vsClass === '1v1';
    if (activeFilter === '1v2') return d.vsClass === '1v2';
    if (activeFilter === '1v多') return d.vsClass === '1v多';
    if (activeFilter === '场景') return ['S1考研场景','G1生活场景'].includes(d.vsClass);
    if (activeFilter === '纵测') return d.vsClass === 'S1纵测';
    return true;
  });

  if (search) {
    filtered = filtered.filter(d =>
      d.nickname.toLowerCase().includes(search) ||
      (d.vsModels||'').toLowerCase().includes(search) ||
      (d.direction||'').toLowerCase().includes(search)
    );
  }

  // Results header
  const vsLabel = activeFilter === '1v1' ? '千问 vs 1个竞品' :
                  activeFilter === '1v2' ? '千问 vs 2个竞品' :
                  activeFilter === '1v多' ? '千问 vs 多个竞品' :
                  activeFilter === '场景' ? '场景化内容' :
                  activeFilter === '纵测' ? '纵向评测' : '全部素材';
  document.getElementById('resultsHeader').innerHTML = `
    <span class="count">共 ${filtered.length} 条素材</span>
    <span class="tag">${vsLabel}</span>
  `;

  const grid = document.getElementById('cardGrid');
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><p>没有匹配的素材</p></div>';
    return;
  }

  // 保存当前过滤结果，供 lightbox 图片切换导航
  window.__currentFiltered = filtered;

  grid.innerHTML = filtered.map((d, idx) => {
    const firstChar = d.nickname.charAt(0);
    const dateStr = d.pubTime || '-';
    const product = d.direction && d.direction.includes('S1') ? '千问AI眼镜S1' :
                    d.direction && d.direction.includes('G1') ? '千问AI眼镜G1' : '千问AI眼镜';
    const modelTag = d.direction && d.direction.includes('S1') ? 'S1' :
                     d.direction && d.direction.includes('G1') ? 'G1' : '';

    // Extract competitor brands from vsModels
    const competitors = extractCompetitors(d.vsModels);
    const vsText = d.vsModels ? `${d.vsModels} · 共${competitors.length}个竞品` : (d.direction || '');

    const copyText = d.copyText || (d.vsModels ? `${d.nickname} | ${d.vsModels}\n发布时间：${d.pubTime || '-'}\n阅读量：${formatNum(d.reads)} | 互动：${formatNum(d.interactions)}` : '');

    const imgId = d.imageId || '';
    const imgData = d.imageData || imageCache[imgId];

    return `
    <div class="card">
      <div class="card-top">
        <div class="card-author">
          <div class="card-avatar">${firstChar}</div>
          <div class="card-name-wrap">
            <div class="card-name">${d.nickname}</div>
            <div class="card-meta">${dateStr} · 图文</div>
          </div>
        </div>
        <div class="card-product-tags">
          <span class="p-tag primary">${product}</span>
          ${competitors.slice(0, 3).map(c => `<span class="p-tag">${c}</span>`).join('')}
        </div>
      </div>
      <div class="card-image-area" ${imgData ? `onclick="openLightbox(${idx})"` : ''}>
        ${imgData ? `<img src="${imgData}" alt="笔记封面">` : `
        <div class="card-image-placeholder">
          <div class="img-icon">🏞️</div>
          <div class="img-text">笔记封面预览</div>
          <div class="img-sub">（图片待补充）</div>
        </div>`}
        ${modelTag ? `<div class="card-model-badge">${modelTag}</div>` : ''}
        ${imgData ? `<div class="card-image-hint">🔍 点击预览</div>` : ''}
      </div>
      <div class="card-bottom">
        <div class="card-vs-text">${vsText}</div>
        <div class="card-actions">
          <button class="btn-copy" onclick="copyText(this, '${escapeJS(copyText)}')">📋 一键复制文案</button>
          ${d.pubLink ? `<a class="btn-link" href="${d.pubLink}" target="_blank">🔗 跳转原文</a>` : '<button class="btn-link" disabled>暂无链接</button>'}
        </div>
      </div>
    </div>`;
  }).join('');
}

/* ===== Helpers ===== */
function extractCompetitors(vsModels) {
  if (!vsModels) return [];
  const text = vsModels.replace(/^S1|G1/g, '').replace(/vs|VS/g, ' ');
  const brandMap = {'乐奇':1,'华为':1,'小米':1,'雷鸟':1,'Meta':1,'科大讯飞':1,'理想':1,'小度':1};
  const found = [];
  for (let b of Object.keys(brandMap)) {
    if (text.includes(b)) found.push(b);
  }
  return found;
}

function formatNum(n) {
  if (!n || n === 0) return '0';
  if (n >= 10000) return (n/10000).toFixed(1) + 'w';
  if (n >= 1000) return (n/1000).toFixed(1) + 'k';
  return String(n);
}

function escapeJS(str) {
  return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/\r/g, '');
}

async function copyText(btn, text) {
  try {
    await navigator.clipboard.writeText(text);
    const original = btn.innerHTML;
    btn.innerHTML = '✅ 已复制';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.innerHTML = original;
      btn.classList.remove('copied');
    }, 1500);
  } catch(e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('已复制到剪贴板');
  }
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

/* ===== Lightbox Controls ===== */
let lbImages = [];   // 当前预览的图片列表
let lbMeta = {};     // 当前预览的卡片元信息
let lbIndex = 0;

function openLightbox(idx) {
  const list = window.__currentFiltered || [];
  const item = list[idx];
  if (!item) return;
  // 该笔记自己的全部图片（有 imageList 用 imageList，否则用封面）
  lbImages = (item.imageList && item.imageList.length > 0) ? item.imageList : (item.imageData ? [item.imageData] : []);
  if (lbImages.length === 0) return;
  lbMeta = item;
  lbIndex = 0;
  showLightboxItem();
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function showLightboxItem() {
  const img = document.getElementById('lightboxImg');
  img.src = lbImages[lbIndex];
  const nameEl = document.getElementById('lbName');
  nameEl.textContent = lbMeta.nickname || '';
  const subEl = document.getElementById('lbSub');
  const product = lbMeta.direction && lbMeta.direction.includes('S1') ? '千问AI眼镜S1' :
                  lbMeta.direction && lbMeta.direction.includes('G1') ? '千问AI眼镜G1' : '';
  const vs = lbMeta.vsModels || lbMeta.direction || '';
  subEl.textContent = [product, vs, lbMeta.pubTime ? lbMeta.pubTime : ''].filter(Boolean).join(' · ');
  const counter = document.getElementById('lbCounter');
  counter.textContent = `${lbIndex + 1} / ${lbImages.length}`;
  // 更新 nav 可用状态
  document.querySelector('.lightbox-prev').style.opacity = lbImages.length > 1 ? 1 : 0.3;
  document.querySelector('.lightbox-next').style.opacity = lbImages.length > 1 ? 1 : 0.3;
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  if (lbImages.length <= 1) return;
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  showLightboxItem();
}

// 点击遮罩关闭
document.addEventListener('click', (e) => {
  if (e.target && e.target.id === 'lightbox') closeLightbox();
});

// Esc 关闭
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') navLightbox(-1);
  if (e.key === 'ArrowRight') navLightbox(1);
});

init();
</script>
